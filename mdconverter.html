<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Payments Formatter</title>
        <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" href="styles.css">
    </head>

    <body>
        <div class="jumbotron bg-light text-center mb-4">
            <h1 class="display-4">Payments Formatter</h1>
        </div>

        <div class="container">
            <div class="row">
                <div class="col-md-6">
                    <h3 class="text-center">Text/Table to Markdown Converter</h3>
                    <p for="inputData" class="form-label">Paste your Google Sheets data here:</p>
                    <textarea class="form-control-input" id="inputData" placeholder=""></textarea>
                </div>
                <div class="col-md-6">

                    <h3 class="text-center">Output</h3>
                    <div class="output-section mt-5">
                        <label for="markdownOutput" class="form-label text-left">Markdown</label>
                        <textarea class="form-control-output" id="markdownOutput" placeholder="" readonly></textarea>
                        <div class="format-button">
                            <button class="btn btn-primary" onclick="copyToClipboard('markdownOutput')">
                                <ion-icon name="copy-outline"></ion-icon>
                                Copy
                            </button>
                        </div>
                    </div>

                    <div class="output-section">
                        <label for="tabularOutput" class="form-label text-left">HTML Table</label>
                        <textarea class="form-control-output" id="tabularOutput" placeholder="" readonly></textarea>
                        <div class="format-button">
                            <button class="btn btn-primary" onclick="copyToClipboard('tabularOutput')">
                                <ion-icon name="copy-outline"></ion-icon>
                                Copy
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
        <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
        <script src="script.js"></script>
    </body>

</html>
