<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Payments Formatter - JSON Formatter</title>
        <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" href="styles.css">
    </head>

    <body>
        <div class="jumbotron bg-light text-center mb-4">
            <h1 class="display-4">Payments Formatter</h1>
        </div>

        <div class="container">
            <div class="row">
                <h4 class="text-center title-2">JSON Formatter</h4>


                <div class="col-md-6">
                    <h4 class="text-center label-formatter">Input</h4>
                    <div class="output-section mt-4">
                        <textarea class="form-control-input" id="inputText" placeholder=""></textarea>
                        <button class="btn btn-danger btn-md-formats-left" id="clearButton" onclick="clearContents()">
                            <ion-icon name="trash-outline"></ion-icon> Clear Contents
                        </button>
                    </div>
                </div>

                <div class="col-md-6">
                    <h4 class="text-center label-formatter">Output</h4>
                    <div class="output-section mt-4">
                        <textarea class="form-control-input" id="outputJson" placeholder="" readonly></textarea>
                        <div class="format-button-json">
                            <button class="btn btn-primary btn-md-formats-right-copy" id="copyButton">
                                <ion-icon name="copy-outline"></ion-icon>
                                Copy
                            </button>
                            <button class="btn btn-primary btn-md-formats-right-export" id="exportGpaste">
                                <ion-icon name="download-outline"></ion-icon>
                                Export to gPaste
                            </button>
                        </div>
                    </div>
                </div>
            </div>
            <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
            <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
            <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
            <script src="jsonconvert.js"></script>
    </body>

</html>
