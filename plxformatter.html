<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Payments Formatter - PLX Parameter Formatter</title>
        <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" href="styles.css">
    </head>

    <body>
        <div class="jumbotron bg-light text-center mb-4">
            <h1 class="display-4">Payments Formatter</h1>
        </div>

        <div class="">
            <h5 class="title-2">PLX Parameter Formatter</h5>

            <div class="form-group">
                <select id="delimiter">
                    <option value="">-- Choose a Delimiter: --</option>
                    <option value=",">Comma (,)</option>
                    <option value=";">Semicolon (;)</option>
                    <option value="|">Pipe (|)</option>
                    <option value="plx">PLX Format</option>
                </select>
            </div>

            <p for="paymentIds" class="form-label">Enter Payment IDs (one per line):</p>
            <textarea class="form-control-input-plx" id="inputOutputArea" placeholder=""></textarea>

            <div class="format-button">
                <button class="btn btn-danger btn-formats" id="clearContents" onclick="clearContents()">
                    <ion-icon name="trash-outline"></ion-icon> Clear Contents
                </button>
                <button class="btn btn-primary btn-formats" id="processButton" onclick="formatCopy()">
                    <ion-icon name="copy-outline"></ion-icon> Format and Copy
                </button>
            </div>

        </div>
        <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
        <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
        <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
        <script src="plxconvert.js"></script>
        </script>
    </body>

</html>
