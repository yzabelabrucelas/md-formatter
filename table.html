<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spreadsheet to Table Converter</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        textarea {
            font-family: 'Inter', sans-serif;
        }
        #output {
            white-space: pre-wrap;
            font-family: monospace;
            border: 1px solid #e5e7eb;
            padding: 0.5rem;
            margin-top: 1rem;
            border-radius: 0.375rem;
            width: 100%;
            min-height: 10rem;
        }
        table {
            border-collapse: collapse;
            width: 100%;
            margin-top: 1rem;
            margin-bottom: 1rem;
        }
        th, td {
            border: 1px solid #e5e7eb;
            padding: 0.5rem;
            text-align: left;
        }
        th {
            background-color: #f9fafb;
            font-weight: 600;
        }
        @media (max-width: 640px) {
            table {
                display: block;
                overflow-x: auto;
            }
        }
    </style>
</head>
<body class="bg-gray-100 p-6">
    <div class="container max-w-2xl mx-auto bg-white shadow-md rounded-lg p-8">
        <h1 class="text-2xl font-semibold text-gray-800 mb-4">Spreadsheet to Table Converter</h1>
        <p class="text-gray-600 mb-4">
            Paste your spreadsheet data (from Google Sheets, Excel, etc.) into the textarea below. The data will be converted to an HTML table.
        </p>

        <textarea id="dataInput" placeholder="Paste your spreadsheet data here..." class="w-full h-48 border border-gray-300 rounded-md p-4 mb-4 focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>

        <div class="mt-4">
            <h2 class="text-lg font-semibold text-gray-700 mb-2">Formatted Data:</h2>
            <div id="tableOutput" class="mt-4">
                <p class="text-gray-600 italic">No table to display yet. </p>
            </div>
        </div>
    </div>

    <script>
        const dataInput = document.getElementById('dataInput');
        const tableOutput = document.getElementById('tableOutput');

        function convertToTable() {
            const data = dataInput.value.trim();
            if (!data) {
                tableOutput.innerHTML = '<p class="text-red-500">Please enter data in the textarea.</p>';
                return;
            }

            const rows = data.split('\n');
            let tableHTML = '<table>';
            let hasData = false; // Flag to check if there's any data to process

            rows.forEach((row, rowIndex) => {
                const columns = row.split('\t'); // Split by tab character
                const trimmedColumns = columns.map(col => col.trim());

                // Check if the row has any actual data
                if (trimmedColumns.some(col => col !== "")) {
                    hasData = true;
                    tableHTML += '<tr>';
                    trimmedColumns.forEach(column => {
                        if (rowIndex === 0) {
                            tableHTML += `<th>${column}</th>`;
                        } else {
                            tableHTML += `<td>${column}</td>`;
                        }
                    });
                    tableHTML += '</tr>';
                }
            });

            tableHTML += '</table>';
            if (hasData) {
                tableOutput.innerHTML = tableHTML;
            } else {
                tableOutput.innerHTML = '<p class="text-red-500">No valid data found in the input.</p>';
            }
        }

        // Call convertToTable when the page loads
        window.onload = convertToTable;
    </script>
</body>
</html>
